<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperSplat Viewer Embed</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1200px;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        @media (max-width: 768px) {
            iframe {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe 
            id="viewer" 
            width="800" 
            height="500" 
            allow="fullscreen; xr-spatial-tracking" 
            src="https://superspl.at/s?id=f7b30517">
        </iframe>
    </div>
</body>
</html>
